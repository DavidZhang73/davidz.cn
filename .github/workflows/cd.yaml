name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.24.0
          run_install: false
      - name: Setup Node.js environment
        uses: actions/setup-node@main
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm run build
          pnpm test
      - name: Deploy with strict SSH verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "101.132.243.87"
          test "$DEPLOY_USER" = "root"
          test "$DEPLOY_PORT" = "22"
          test "$TARGET" = "/opt/1panel/www/sites/davidz.cn/index/"
          test -s dist/index.html
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          chmod 600 "$key_file" "$hosts_file"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          ssh_opts=(-i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -p "$DEPLOY_PORT")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "test -d '$TARGET' && test ! -L '$TARGET'"
          printf -v RSYNC_RSH '%q ' ssh "${ssh_opts[@]}"
          export RSYNC_RSH
          rsync -rltgoDzvO --delete --delay-updates dist/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET"
