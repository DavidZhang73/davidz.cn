name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.24.0
          run_install: false
      - name: Setup Node.js environment
        uses: actions/setup-node@main
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm run build
          pnpm test
      - name: Deploy with strict SSH verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TARGET: ${{ vars.TARGET }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SF_DEPLOY_HOST: ${{ vars.SF_DEPLOY_HOST }}
          SF_DEPLOY_USER: ${{ vars.SF_DEPLOY_USER }}
          SF_DEPLOY_PORT: ${{ vars.SF_DEPLOY_PORT }}
          SF_TARGET: ${{ vars.SF_TARGET }}
          SF_SSH_KNOWN_HOSTS: ${{ vars.SF_SSH_KNOWN_HOSTS }}
        run: python3 scripts/deploy_homepage.py
